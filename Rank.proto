syntax = "proto3";
package ProtoMessage;
option java_package = "com.yongyoung.dream";
option java_multiple_files = true;
option java_outer_classname = "RankProto";
option go_package = "message";

enum RankType {
  RankTypeUnknown = 0;
  Population = 1;
  Food = 2;
}

message RankRequest {
  RankType type = 1;
  int32 limit = 2;
}

message RankResponse {
  RankType type = 1;
  repeated RankEntry ranks = 2;
  int32 selfRank = 3;
}

message RankEntry {
  int32 rank = 1;
  int64 playerId = 2;
  string name = 3;
  int32 level = 4;
  int64 value = 5;
  int32 people = 6;
  int64 food = 7;
}
