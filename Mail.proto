syntax = "proto3";
package ProtoMessage;
option java_package = "com.yongyoung.dream";
option java_multiple_files = true;
option java_outer_classname = "MailProto";
option go_package = "message";

import "Item.proto";

message MailAttachment { int32 configId = 1; int64 count = 2; }
message MailInfo {
  int64 id = 1;
  int64 senderId = 2;
  string senderName = 3;
  int64 receiverId = 4;
  string title = 5;
  string content = 6; // UTF-8 text, including emoji
  repeated MailAttachment attachments = 7;
  int64 sentAt = 8;
  bool read = 9;
  bool claimed = 10;
  bool system = 11;
}
message MailListRequest {}
message MailListResponse { repeated MailInfo mails = 1; }
message MailSendRequest { int64 receiverId = 1; string receiverName = 2; string title = 3; string content = 4; }
message MailSendResponse { bool success = 1; string error = 2; MailInfo mail = 3; }
message MailReadRequest { int64 mailId = 1; }
message MailReadResponse { bool success = 1; string error = 2; int64 mailId = 3; }
message MailClaimRequest { int64 mailId = 1; }
message MailClaimResponse { bool success = 1; string error = 2; int64 mailId = 3; repeated ItemInfo items = 4; }
message MailDeleteRequest { int64 mailId = 1; }
message MailDeleteResponse { bool success = 1; string error = 2; int64 mailId = 3; }
message MailPushResponse { MailInfo mail = 1; }
