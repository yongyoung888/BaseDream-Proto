syntax = "proto3";

package ProtoMessage;
option java_package = "com.yongyoung.dream";
option java_multiple_files = true;
option java_outer_classname = "ChatProto";
option go_package = "message";

enum ChatChannelType {
  CHAT_CHANNEL_UNKNOWN = 0;
  CHAT_CHANNEL_WORLD = 1;
  CHAT_CHANNEL_PRIVATE = 2;
  CHAT_CHANNEL_DISCUSSION = 3;
}

enum ChatReportReason {
  CHAT_REPORT_REASON_UNKNOWN = 0;
  CHAT_REPORT_REASON_ABUSE = 1;
  CHAT_REPORT_REASON_SPAM = 2;
  CHAT_REPORT_REASON_SEXUAL_CONTENT = 3;
  CHAT_REPORT_REASON_THREAT = 4;
  CHAT_REPORT_REASON_OTHER = 5;
}

message ChatMessage {
  int64 messageId = 1;
  ChatChannelType channelType = 2;
  int64 conversationId = 3;
  int64 senderId = 4;
  string senderName = 5;
  string content = 6;
  int64 sentAt = 7;
  string clientMessageId = 8;
}

message ChatSendRequest {
  ChatChannelType channelType = 1;
  int64 targetPlayerId = 2;
  int64 discussionGroupId = 3;
  string content = 4;
  string clientMessageId = 5;
  string targetAccount = 6;
}

message ChatSendResponse {
  bool success = 1;
  string error = 2;
  ChatMessage message = 3;
  int64 targetPlayerId = 4;
  string targetAccount = 5;
}

message ChatMessagePush {
  ChatMessage message = 1;
}

message ChatHistoryRequest {
  ChatChannelType channelType = 1;
  int64 conversationId = 2;
  int64 beforeMessageId = 3;
  int32 limit = 4;
  string targetAccount = 5;
}

message ChatHistoryResponse {
  repeated ChatMessage messages = 1;
  ChatChannelType channelType = 2;
  int64 conversationId = 3;
  int64 targetPlayerId = 4;
  string targetAccount = 5;
  string error = 6;
}

message ChatReportRequest {
  int64 messageId = 1;
  ChatReportReason reason = 2;
  string detail = 3;
}

message ChatReportResponse {
  bool success = 1;
  string error = 2;
  int64 reportId = 3;
}

message ChatBlockRequest {
  int64 targetPlayerId = 1;
  bool blocked = 2;
}

message ChatBlockResponse {
  bool success = 1;
  string error = 2;
  int64 targetPlayerId = 3;
  bool blocked = 4;
}

message ChatBlockListRequest {
}

message ChatBlockListResponse {
  repeated int64 blockedPlayerIds = 1;
}

message DiscussionGroupInfo {
  int64 groupId = 1;
  string name = 2;
  int64 ownerId = 3;
  repeated int64 memberIds = 4;
  int64 createdAt = 5;
}

message DiscussionGroupCreateRequest {
  string name = 1;
  repeated int64 memberIds = 2;
}

message DiscussionGroupCreateResponse {
  bool success = 1;
  string error = 2;
  DiscussionGroupInfo group = 3;
}

message DiscussionGroupListRequest {
}

message DiscussionGroupListResponse {
  repeated DiscussionGroupInfo groups = 1;
}
