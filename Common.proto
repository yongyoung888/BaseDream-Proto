syntax = "proto3";
package ProtoMessage;
option java_package = "com.yongyoung.dream";
option java_multiple_files = true;
option java_outer_classname = "CommonProto";
//import "MessageId.proto";
option go_package="message";

//http 调用
message HttpRequest{
  string path                 = 1; //路径
  int64 id                    = 2; //唯一标识id
  string jsonParam            = 3; //json字符串参数
}
//http 调用
message HttpResponse{
  int32 code                  = 2; //结果码 200成功
  string result               = 3; //返回结果字符串
}



//璁剧疆椤?
message SettingItem{
  string key                  = 1; //閿?
  string value                = 2; //鍊?
}

//淇濆瓨璁剧疆璇锋眰
message SaveSettingRequest{
  repeated SettingItem items  = 1; //璁剧疆椤瑰垪琛?
}

//淇濆瓨璁剧疆杩斿洖
message SaveSettingResponse{
  repeated SettingItem items  = 1; //璁剧疆椤瑰垪琛?
}

//rpc
service CommonRpcService{
  //http请求
  rpc httpPost(HttpRequest) returns (HttpResponse);

}
